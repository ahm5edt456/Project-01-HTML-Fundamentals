<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" contant="width=device-width, initial-scale=1.0">
        <title>My Form</title>
    </head>

    <body>
        <h1>Form 42</h1>
        <form>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname"

            required

            name="email"
            required>

            <br><br>

            name="password"
            required
            minlength="8">

            <br><br>

            <label for="42Irbid">42Irbid</label>

            id="42Irbid" name="campus"
            value="42Irbid"
            required>

            id="42Amman" name="campus"

            required>

                <option value="">Choose a programing</option>
                <option value="piscine">piscine</option>
                <option value="core">core</option>

            <label for="bio">About you:</label>

            name="bio"

            required></textarea>

            <br><br>

            <input 
            type="checkbox"

            required>

        </form>
    </body>
</html>
